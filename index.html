<style>
:root{--ink:var(--color-text-primary,#18181b);--bg:var(--color-background-primary,#fff);--line:var(--color-border-primary,#e4e4e7);--mute:#71717a;--acc:#2563eb;--ok:#15803d;--warn:#b45309}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 var(--font-sans,system-ui,sans-serif);color:var(--ink);background:var(--bg)}
.w{max-width:900px;margin:0 auto;padding:16px}h1{font-size:20px;margin:0}h2{font-size:16px;margin:24px 0 8px}
.sub{color:var(--mute);font-size:12px}.card{border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}
button{min-height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;font:inherit}
button.p{background:var(--acc);border-color:var(--acc);color:#fff}button:disabled{opacity:.5}
.chip{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mute)}
.chip.ok{color:var(--ok);border-color:var(--ok)}.chip.w{color:var(--warn);border-color:var(--warn)}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);margin-top:8px}
.txt{white-space:pre-wrap}textarea{width:100%;min-height:80px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right}td:first-child,th:first-child{text-align:left}
.big{font-size:28px;font-weight:600}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
details summary{cursor:pointer;color:var(--mute)}
